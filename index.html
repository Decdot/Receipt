<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one big savings figure and its chart lead; everything else is quiet ledger rows with dotted leaders */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE8; --ink:#13201B; --ink-2:#4F5E57; --muted:#7C8882; --line:#DCE2DD;
  --accent:#0B6B4D; --accent-ink:#FFFFFF; --accent-soft:#DFEFE7; --pos:#0B8A5F; --neg:#C5432E; --neg-soft:#F8E4DF;
  --y1:#2a78d6; --y2:#eb6834; --y3:#1baf7a; --y4:#eda100;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1412; --surface:#161D1A; --sunk:#1E2723; --ink:#E7EDE9; --ink-2:#A7B3AC; --muted:#7F8B84; --line:#28332E;
    --accent:#38B888; --accent-ink:#06130E; --accent-soft:#16332A; --pos:#38B888; --neg:#EE7B66; --neg-soft:#3A1E19;
    --y1:#3987e5; --y2:#d95926; --y3:#199e70; --y4:#c98500;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1412; --surface:#161D1A; --sunk:#1E2723; --ink:#E7EDE9; --ink-2:#A7B3AC; --muted:#7F8B84; --line:#28332E;
  --accent:#38B888; --accent-ink:#06130E; --accent-soft:#16332A; --pos:#38B888; --neg:#EE7B66; --neg-soft:#3A1E19;
  --y1:#3987e5; --y2:#d95926; --y3:#199e70; --y4:#c98500;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .soft{color:var(--ink-2)} .muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}

.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:20px}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.brand i{width:12px;height:18px;border-radius:2px 4px 4px 2px;background:var(--accent);display:block;box-shadow:inset 3px 0 0 rgba(0,0,0,.22)}
.nav{display:flex;gap:2px;margin-left:8px}
.nav a{padding:7px 13px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14px}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--ink);color:var(--bg)}
.sync{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--pos)}
.sync.saving i{background:var(--y4)} .sync.error i{background:var(--neg)} .sync.local i{background:var(--muted)}

main{max-width:1120px;margin:0 auto;padding:26px 24px 110px;display:flex;flex-direction:column;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner .grow{flex:1;min-width:200px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--neg)}
.btn.small{padding:5px 10px;font-size:13px}
.link{background:none;border:none;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* savings home */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hero-fig{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,8vw,76px);line-height:1;letter-spacing:-.035em;margin:6px 0 4px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile b{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.tile small{color:var(--ink-2);font-size:12.5px}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.card-head h3{font-size:17px;font-weight:700}
.chart{position:relative;width:100%}
.chart svg{display:block;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1} .chart .grid.zero{stroke:var(--muted)}
.chart .tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart .endlabel{fill:var(--ink-2);font-size:11.5px;font-weight:600}
.chart .bar-pos{fill:var(--pos)} .chart .bar-neg{fill:var(--neg)} .chart .dim{opacity:.45}
.chart .xhair{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.5;white-space:nowrap;z-index:5}
.tip b{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.catbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:7px 0;font-size:14px}
.catbar .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.catbar .track i{display:block;height:100%;border-radius:3px;background:var(--accent)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:9px 10px;border-bottom:1px dotted var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td.strong{font-weight:600}

/* month ledger */
.month-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.month-bar h1{font-size:30px;letter-spacing:-.02em;min-width:210px}
.month-bar .arrow{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.month-bar .arrow:disabled{opacity:.35;cursor:default}
.month-bar .spacer{flex:1}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.sum div b{display:block;font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.sum .saved b{font-size:30px}
.stack{display:flex;gap:2px;height:10px;margin-top:14px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.qa{display:grid;grid-template-columns:auto minmax(0,2fr) 110px minmax(0,1.2fr) 150px auto;gap:8px;align-items:center}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.cols{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:22px;align-items:start}
.cols>div{display:flex;flex-direction:column;gap:22px}
.list{padding:6px 0}
.list-head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 20px 6px;gap:10px}
.list-head h3{font-size:16px}
.row{display:flex;align-items:baseline;gap:10px;width:100%;padding:8px 20px;background:none;border:none;text-align:left}
.row:hover{background:var(--sunk)}
.row .d{font-size:12.5px;color:var(--muted);width:48px;flex-shrink:0;font-variant-numeric:tabular-nums}
.row .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .leader{flex:1;min-width:10px;border-bottom:1px dotted var(--muted);opacity:.5;transform:translateY(-4px)}
.row .a{font-variant-numeric:tabular-nums;font-weight:500;flex-shrink:0}
.sub{padding:2px 20px 2px 78px;display:flex;gap:10px;font-size:13px;color:var(--ink-2)}
.sub .leader{flex:1;border-bottom:1px dotted var(--muted);opacity:.4;transform:translateY(-4px)}
.chip{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:1px 7px;color:var(--ink-2);flex-shrink:0;white-space:nowrap}
.bulk{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1.4fr) auto;gap:8px;padding:10px 20px 14px;border-bottom:1px solid var(--line)}
@media (max-width:760px){.bulk{grid-template-columns:minmax(0,1fr) auto;padding:10px 16px 14px}.bulk .eyebrow{grid-column:1/-1}}
.chip.warn{border-color:var(--neg);color:var(--neg)}
/* search results: tickbox to keep a hit in or out of bulk edits */
.hit{display:flex;align-items:flex-start}
.hit>input{margin:11px 0 0 20px;width:17px;height:17px;accent-color:var(--accent);flex-shrink:0;cursor:pointer}
.hit-body{flex:1;min-width:0}
.hit .row{padding-left:10px} .hit .sub{padding-left:68px}
.hit.off .hit-body{opacity:.45}
@media (max-width:760px){.hit>input{margin-left:16px}}
.bulk.rn{grid-template-columns:auto minmax(0,1fr) auto}
@media (max-width:760px){.bulk.rn{grid-template-columns:minmax(0,1fr) auto;padding-bottom:4px;border-bottom:none}}
.catrow .inp{flex:1}
.catrow .payee{width:36%;flex-shrink:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-h{display:flex;align-items:center;gap:10px;width:100%;padding:11px 20px;background:none;border:none;border-top:1px solid var(--line);text-align:left;font-weight:600}
.cat-h:hover{background:var(--sunk)}
.cat-h .chev{font-size:10px;color:var(--muted);transition:transform .15s;width:10px}
.cat-h.closed .chev{transform:rotate(-90deg)}
.cat-h .a{margin-left:auto;font-variant-numeric:tabular-nums}
.cat-h .n{font-weight:400;color:var(--muted);font-size:13px}
.total{display:flex;justify-content:space-between;padding:11px 20px 8px;border-top:1px solid var(--line);font-weight:600}
.empty{padding:16px 20px;color:var(--ink-2);font-size:14px}

.fab{display:none;position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:25}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:24;padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;text-align:center;padding:12px 2px 11px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none}
.tabbar a.on{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(8,14,11,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{background:var(--surface);border-radius:14px;width:460px;max-width:100%;max-height:92vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.sheet.wide{width:1000px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-head h2{font-size:21px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--ink-2)}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px;align-items:center}
.item.single{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
.err{color:var(--neg);font-size:13.5px;margin:0}
.sheet-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet-foot .spacer{flex:1}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.icons button{font-size:20px;padding:6px 0;border:1px solid transparent;border-radius:8px;background:none}
.icons button.on{border-color:var(--accent);background:var(--accent-soft)}
.imp td,.imp th{text-align:left;padding:6px 8px}
.imp td.r,.imp th.r{text-align:right}
.imp .inp{padding:5px 8px;font-size:13.5px}
.imp tr.off td{opacity:.45}
.maprow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:60;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast button{background:none;border:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.welcome{max-width:620px;margin:6vh auto 0;display:flex;flex-direction:column;gap:18px}
.welcome h1{font-size:clamp(34px,6vw,52px);letter-spacing:-.03em;line-height:1.02}
.opt{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.catrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line)}
.catrow:last-of-type{border-bottom:none}
.catrow .ic{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;align-items:start}
.settings p{margin:6px 0 14px;color:var(--ink-2);font-size:14px;max-width:60ch}

@media (max-width:760px){
  .nav{display:none} .tabbar{display:flex} .fab{display:block} .fab[hidden]{display:none}
  .top-in{padding:10px 16px} main{padding:18px 16px 150px;gap:16px}
  .tiles{grid-template-columns:1fr 1fr;gap:10px} .two,.cols{grid-template-columns:minmax(0,1fr)}
  .sum{grid-template-columns:1fr 1fr} .qa{display:none}
  .month-bar h1{font-size:24px;min-width:0;flex:1;order:-1;flex-basis:100%}
  .scrim{align-items:flex-end;padding:0} .sheet{width:100%;border-radius:16px 16px 0 0;max-height:94vh;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
  .inp{padding:11px 12px;font-size:16px} .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .card{padding:16px} .list-head,.row,.cat-h,.total,.empty{padding-left:16px;padding-right:16px} .sub{padding-left:74px;padding-right:16px}
  .list{padding:6px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><i></i>Passbook</div>
  <nav class="nav" id="nav"></nav>
  <div class="sync local" id="sync"><i></i><span>Loading</span></div>
</div></header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Add an entry" hidden>+</button>
<nav class="tabbar" id="tabbar"></nav>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="fileSnap" accept=".json,application/json" hidden>
<input type="file" id="fileCsv" accept=".csv,text/csv,text/plain" hidden>

<script>
// ---------- your Firebase project ----------
// Paste the firebaseConfig values from the Firebase console here.
// With apiKey left empty, Passbook keeps its data in this browser only.
const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCVk3Recqj-A4qTfxmfV9msxlITYhxANhw",
    authDomain: "receipt-f71cb.firebaseapp.com",
    projectId: "receipt-f71cb",
    storageBucket: "receipt-f71cb.firebasestorage.app",
    messagingSenderId: "1020930457051",
    appId: "1:1020930457051:web:7fc1bf3e7a911bddc47bfe"
};
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/12.11.0/';
let fb = null; // Firebase modules, auth, database and the signed-in user once loaded

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MNL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const fmt = n => (n < 0 ? '−' : '') + '£' + Math.abs(round2(n)).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtSigned = n => (round2(n) >= 0 ? '+' : '−') + '£' + Math.abs(round2(n)).toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtK = n => { const a = Math.abs(n), s = n < 0 ? '−' : ''; return a >= 1000 ? s + '£' + (a/1000).toFixed(a % 1000 === 0 ? 0 : 1) + 'k' : s + '£' + Math.round(a); };
const pct = n => isFinite(n) ? Math.round(n * 100) + '%' : '–';
const uid = p => p + Math.random().toString(36).slice(2, 9);
// Local date, not UTC, so late-night entries land on the right day
function todayIso(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
// A date on or after the chosen start day counts towards the following month (28 Oct -> November)
function monthFor(date){
  const n = state && state.settings ? +state.settings.monthStartDay || 1 : 1, ym = date.slice(0, 7);
  return n > 1 && +date.slice(8, 10) >= n ? addMonths(ym, 1) : ym;
}
const curYm = () => monthFor(todayIso());
const ordinal = n => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');
function periodLabel(ym){
  const n = +state.settings.monthStartDay || 1; if(n < 2) return '';
  const p = addMonths(ym, -1);
  return n + ' ' + MN[+p.slice(5) - 1] + ' to ' + (n - 1) + ' ' + MN[+ym.slice(5) - 1];
}
// Moves entries to the month their date falls in: all dated income, and imported purchases. Hand-entered purchases keep their month
function resortImports(){
  const touched = new Set(); let n = 0;
  const move = (o, date, all) => { if(!(all || o.importKey) || !date) return; const ym = monthFor(date); if(ym === o.monthKey) return; touched.add(o.monthKey); o.monthKey = ym; n++; if(!state.addedMonths.includes(ym)) state.addedMonths.push(ym); };
  state.transactions.forEach(t => move(t, t.items[0] && t.items[0].date));
  state.incomes.forEach(i => move(i, i.date, true));
  state.transfers.forEach(x => move(x, x.date, true));
  const used = new Set([...state.transactions.map(t => t.monthKey), ...state.incomes.map(i => i.monthKey)]);
  state.addedMonths = state.addedMonths.filter(k => !(touched.has(k) && !used.has(k)));
  return n;
}
function addMonths(ym, n){ let [y, m] = ym.split('-').map(Number); m += n - 1; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + String(m + 1).padStart(2, '0'); }
const monthLabel = ym => MN[+ym.slice(5) - 1] + ' ' + ym.slice(0, 4);

// Accepts every older Passbook shape (v2 flat transactions, v3 items) and fills in what is missing
function migrate(d){
  d.categories = d.categories || defaultCategories();
  d.addedMonths = d.addedMonths || [];
  d.settings = d.settings || {};
  if(typeof d.settings.collapseCategoriesByDefault !== 'boolean') d.settings.collapseCategoriesByDefault = false;
  if(!(d.settings.monthStartDay >= 1 && d.settings.monthStartDay <= 28)) d.settings.monthStartDay = 1;
  d.lastEntryDefaults = d.lastEntryDefaults || {};
  d.lastRecurringDefaults = d.lastRecurringDefaults || {};
  d.merchantMap = d.merchantMap || {};
  d.transactions = (d.transactions || []).map(t => {
    if(!t.items){
      const date = t.date !== undefined ? t.date : null;
      t = {id: t.id || uid('t'), monthKey: t.monthKey || (date ? date.slice(0,7) : null), categoryId: t.categoryId, recurring: !!t.recurring, desc: t.desc,
        items: [{id: uid('li'), name: '', amount: +t.amount || 0, date}]};
    }
    if(!t.monthKey) t.monthKey = (t.items[0] && t.items[0].date) ? t.items[0].date.slice(0,7) : (d.addedMonths[0] || null);
    return t;
  });
  d.transfers = d.transfers || [];
  d.incomes = (d.incomes || []).map(i => { if(i.date === undefined) i.date = null; if(!i.monthKey) i.monthKey = i.date ? i.date.slice(0,7) : (d.addedMonths[0] || null); return i; });
  if(!d.balanceHistory){
    d.balanceHistory = [];
    const start = typeof d.settings.startingBalance === 'number' ? d.settings.startingBalance : 0;
    const first = [...d.transactions.map(t => t.monthKey), ...d.incomes.map(i => i.monthKey), ...d.addedMonths].filter(Boolean).sort()[0];
    if(start && first) d.balanceHistory.push({id: uid('bh'), date: first + '-01', monthKey: first, accounts: {debit: start, savings: 0, isa: 0}, total: start});
  }
  return d;
}

// One row per calendar month from the first tracked to the last, with running totals
function reindex(){
  const by = {};
  const get = ym => by[ym] || (by[ym] = {ym, tracked: true, inc: 0, rec: 0, day: 0, tx: [], incs: []});
  state.transactions.forEach(t => { if(!t.monthKey) return; const m = get(t.monthKey), v = entryTotal(t); if(t.recurring) m.rec += v; else m.day += v; m.tx.push(t); });
  state.incomes.forEach(i => { if(!i.monthKey) return; const m = get(i.monthKey); m.inc += +i.amount || 0; m.incs.push(i); });
  state.addedMonths.forEach(get);
  const keys = Object.keys(by).sort(), months = [];
  if(keys.length){
    let cum = 0, ytd = 0, yr = '';
    for(let ym = keys[0]; ym <= keys[keys.length-1]; ym = addMonths(ym, 1)){
      const m = by[ym] || (by[ym] = {ym, tracked: false, inc: 0, rec: 0, day: 0, tx: [], incs: []});
      m.out = m.rec + m.day; m.net = m.inc - m.out;
      if(ym.slice(0,4) !== yr){ yr = ym.slice(0,4); ytd = 0; }
      cum += m.net; ytd += m.net; m.cum = cum; m.ytd = ytd;
      months.push(m);
    }
  }
  IDX = {by, months, keys};
}
const catById = id => state.categories.find(c => c.id === id) || {id, name: 'No Category', icon: '❔'};
function uncategorized(){
  let c = state.categories.find(c => c.id === UNCAT);
  if(!c){ c = {id: UNCAT, name: 'No Category', icon: '❔'}; state.categories.push(c); }
  return c;
}

// ---------- storage: Claude account when published, this browser otherwise ----------
function splitDocs(s){
  const docs = {meta: {schema: 4}};
  for(const k in s) if(k !== 'transactions' && k !== 'incomes' && k !== 'transfers') docs.meta[k] = s[k];
  const m = k => docs[k] || (docs[k] = {transactions: [], incomes: []});
  s.transactions.forEach(t => m('m-' + (t.monthKey || 'none')).transactions.push(t));
  s.incomes.forEach(i => m('m-' + (i.monthKey || 'none')).incomes.push(i));
  // Only months that have transfers get the extra list, so older month docs stay unchanged
  (s.transfers || []).forEach(x => { const d = m('m-' + (x.monthKey || 'none')); (d.transfers || (d.transfers = [])).push(x); });
  return docs;
}
function cloudStore(col){
  let saved = {}, timer = null, flushing = false, pending = false, again = false, loadedAt = 0;
  const mark = s => { saved = {}; const d = splitDocs(s); for(const k in d) saved[k] = JSON.stringify(d[k]); };
  async function load(){
    const snap = await col.get();
    loadedAt = Date.now();
    if(snap.empty) { saved = {}; return null; }
    const s = {transactions: [], incomes: [], transfers: []}; let meta = null;
    snap.docs.forEach(d => {
      const data = d.data(); if(!data) return;
      const c = JSON.parse(JSON.stringify(data));
      if(d.id === 'meta') meta = c;
      else if(d.id.startsWith('m-')){ s.transactions.push(...(c.transactions || [])); s.incomes.push(...(c.incomes || [])); s.transfers.push(...(c.transfers || [])); }
    });
    if(!meta && !s.transactions.length && !s.incomes.length && !s.transfers.length) return null;
    if(meta){ delete meta.schema; Object.assign(s, meta); }
    return s;
  }
  async function flush(){
    if(flushing){ again = true; return; }
    flushing = true; pending = false; setSync('saving');
    try{
      const docs = splitDocs(state);
      for(const id of new Set([...Object.keys(docs), ...Object.keys(saved)])){
        const str = docs[id] ? JSON.stringify(docs[id]) : null;
        if(str === saved[id]) continue;
        if(str === null){ await col.doc(id).delete(); delete saved[id]; }
        else { await col.doc(id).set(JSON.parse(str)); saved[id] = str; }
      }
      setSync('ok');
    }catch(e){
      const full = e && e.code === 'quota_exceeded';
      setSync('error', full ? 'Storage is full' : 'Not saved yet, retrying');
      pending = true;
      if(!full){ clearTimeout(timer); timer = setTimeout(flush, 6000); }
    }
    flushing = false;
    if(again){ again = false; flush(); }
  }
  return {cloud: true, load, mark,
    save(){ pending = true; setSync('saving'); clearTimeout(timer); timer = setTimeout(flush, 400); },
    busy: () => flushing || pending,
    stale: () => Date.now() - loadedAt > 20000};
}
function localStore(){
  const KEYS = ['passbook_data_v4', 'passbook_data_v3', 'passbook_data_v2'];
  return {cloud: false, mark(){}, busy: () => false, stale: () => false,
    async load(){
      for(const k of KEYS){
        try{ const p = JSON.parse(localStorage.getItem(k)); if(p && p.categories && p.transactions && p.incomes) return p; }catch(e){}
      }
      return null;
    },
    save(){ try{ localStorage.setItem(KEYS[0], JSON.stringify(state)); setSync('local', 'Saved on this device'); }catch(e){ setSync('error', 'Could not save'); } }};
}
const sync = {cls: 'local'};
function setSync(cls, text){
  sync.cls = cls;
  const el = $('sync');
  el.className = 'sync ' + (cls === 'ok' ? '' : cls);
  el.querySelector('span').textContent = text || {ok: 'Saved to your account', saving: 'Saving', local: 'Saved on this device', error: 'Not saved'}[cls];
}
function persist(){ if(store && state) store.save(); }

// ---------- recurring carry-forward ----------
function shiftDate(iso, ym){
  if(!iso) return null;
  const n = +state.settings.monthStartDay || 1, day = +iso.slice(8, 10) || 1;
  if(n > 1 && day >= n) ym = addMonths(ym, -1);
  const [y, m] = ym.split('-').map(Number);
  return ym + '-' + String(Math.min(day, new Date(y, m, 0).getDate())).padStart(2, '0');
}
function recurringSource(ym){
  const has = k => state.transactions.some(t => t.monthKey === k && t.recurring) || state.incomes.some(i => i.monthKey === k && i.recurring);
  if(has(ym)) return null;
  return IDX.keys.filter(k => k < ym).reverse().find(has) || null;
}
// Starts a month if it is new, copying recurring items from the nearest earlier month. Returns how many were copied
function startMonth(ym, carry){
  if(IDX.by[ym] && IDX.by[ym].tracked) return 0;
  if(!state.addedMonths.includes(ym)) state.addedMonths.push(ym);
  const src = carry ? recurringSource(ym) : null;
  if(!src) return 0;
  let n = 0;
  state.transactions.filter(t => t.monthKey === src && t.recurring).forEach(t => { n++;
    state.transactions.push({id: uid('t'), monthKey: ym, categoryId: t.categoryId, recurring: true, desc: t.desc,
      items: t.items.map(it => ({id: uid('li'), name: it.name, amount: it.amount, date: shiftDate(it.date, ym)}))}); });
  state.incomes.filter(i => i.monthKey === src && i.recurring).forEach(i => { n++;
    state.incomes.push({id: uid('i'), monthKey: ym, label: i.label, amount: i.amount, date: shiftDate(i.date, ym), recurring: true}); });
  return n;
}

// ---------- charts (inline SVG, one y-axis each) ----------
function niceScale(min, max, count){
  if(max - min < 1) max = min + 1;
  const raw = (max - min) / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for(let v = lo; v <= hi + step / 2; v += step) ticks.push(round2(v));
  return {lo, hi, ticks};
}
function chart(el, c){
  if(!el) return;
  const W = Math.max(260, el.clientWidth), H = c.height || 230, n = c.labels.length;
  const m = {l: 48, r: c.endLabels ? 46 : 10, t: 12, b: 26};
  const all = c.series.flatMap(s => s.values).filter(v => v != null);
  const sc = niceScale(Math.min(0, ...all), Math.max(0, ...all), 4);
  const pw = W - m.l - m.r, ph = H - m.t - m.b, bw = pw / Math.max(n, 1);
  const x = i => m.l + (i + .5) * bw, y = v => m.t + ph * (1 - (v - sc.lo) / (sc.hi - sc.lo));
  let g = '';
  sc.ticks.forEach(t => { g += `<line class="grid${t === 0 ? ' zero' : ''}" x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/><text class="tick" x="${m.l - 8}" y="${y(t) + 4}" text-anchor="end">${fmtK(t)}</text>`; });
  const every = Math.max(1, Math.ceil(n * 50 / pw));
  c.labels.forEach((lb, i) => { if((n - 1 - i) % every === 0) g += `<text class="tick" x="${x(i)}" y="${H - 7}" text-anchor="middle">${esc(lb)}</text>`; });
  if(c.type === 'bar'){
    const w = Math.max(3, Math.min(30, bw * .62));
    c.series[0].values.forEach((v, i) => {
      if(!v) return;
      const y0 = y(0), y1 = y(v), r = Math.min(4, w / 2, Math.abs(y1 - y0)), X = x(i) - w / 2;
      const d = v > 0 ? `M${X},${y0}V${y1 + r}q0,${-r} ${r},${-r}h${w - 2*r}q${r},0 ${r},${r}V${y0}z` : `M${X},${y0}V${y1 - r}q0,${r} ${r},${r}h${w - 2*r}q${r},0 ${r},${-r}V${y0}z`;
      g += `<path d="${d}" class="${v > 0 ? 'bar-pos' : 'bar-neg'}${c.dim && c.dim[i] ? ' dim' : ''}"/>`;
    });
  } else c.series.forEach((s, si) => {
    const pts = []; s.values.forEach((v, i) => { if(v != null) pts.push([x(i), y(v)]); });
    if(!pts.length) return;
    const d = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L'), e = pts[pts.length - 1];
    if(c.area && si === 0) g += `<path d="${d}L${e[0]},${y(0)}L${pts[0][0]},${y(0)}z" fill="${s.color}" opacity=".13"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${e[0]}" cy="${e[1]}" r="4.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    if(c.endLabels) g += `<text class="endlabel" x="${e[0] + 9}" y="${e[1] + 4}">${esc(s.name)}</text>`;
  });
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.label || '')}">${g}<line class="xhair" y1="${m.t}" y2="${m.t + ph}" style="display:none"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xhair');
  let cur = -1;
  const move = e => {
    const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - r.left - m.l) / bw)));
    if(i === cur) return; cur = i;
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.style.display = '';
    tip.innerHTML = c.tip(i); tip.hidden = false;
    let L = x(i) + 12; if(L + tip.offsetWidth > W) L = x(i) - 12 - tip.offsetWidth;
    tip.style.left = Math.max(0, L) + 'px'; tip.style.top = m.t + 'px';
  };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', () => { cur = -1; xh.style.display = 'none'; tip.hidden = true; });
  if(c.onPick){ svg.style.cursor = 'pointer'; svg.addEventListener('click', () => { if(cur >= 0) c.onPick(cur); }); }
}

}

// Turns a purchase or income into a transfer record
function toTransfer(o){
  const isTx = !!o.items, key = o.importKey || (isTx && o.items.map(i => i.importKey).find(Boolean)) || '';
  return {id: uid('x'), monthKey: o.monthKey, date: isTx ? ((o.items[0] || {}).date || null) : o.date, kind: isTx ? 'out' : 'in',
    amount: round2(isTx ? entryTotal(o) : +o.amount || 0), title: isTx ? o.desc : o.label, importKey: key};
}
// Marks a payee as a transfer, keeping any title it already has unless a new one is given
function rememberTransfer(k, title){
  if(!k) return;
  const prev = state.merchantMap[k] || {};
  state.merchantMap[k] = Object.assign({transfer: true}, title ? {title} : prev.transfer && prev.title ? {title: prev.title} : {});
}
const transferTitle = (raw, fallback) => { const mm = state.merchantMap[normDesc(raw)]; return (mm && mm.transfer && mm.title) || fallback; };
function moveToTransfers(list){
  const gone = new Set(list);
  list.forEach(o => { const t = toTransfer(o), k = normDesc(rawOf(t)); rememberTransfer(k); t.title = transferTitle(rawOf(t), t.title); state.transfers.push(t); });
  state.transactions = state.transactions.filter(o => !gone.has(o)); state.incomes = state.incomes.filter(o => !gone.has(o));
  return gone.size;
}

// ---------- bank statement import ----------
function parseCsv(text){
  text = text.replace(/^﻿/, '');
  const firstLines = text.split(/\r?\n/).slice(0, 5).join('\n');
  const delim = [',', ';', '\t'].sort((a, b) => firstLines.split(b).length - firstLines.split(a).length)[0];
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"') q = true;
    else if(ch === delim){ row.push(cell); cell = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if(row.some(c => c.trim())) rows.push(row); row = []; }
    else cell += ch;
  }
  row.push(cell); if(row.some(c => c.trim())) rows.push(row);
  return rows.map(r => r.map(c => c.trim()));
}
function parseDate(s){
  if(!s) return null;
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m) return iso(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[-\/.\s](\d{1,2})[-\/.\s](\d{2,4})/);
  if(m){ let d = +m[1], mo = +m[2]; if(mo > 12 && d <= 12) [d, mo] = [mo, d]; return iso(+m[3], mo, d); }
  m = s.match(/^(\d{1,2})[\s-]([A-Za-z]{3})[A-Za-z]*[\s-](\d{2,4})/);
  if(m){ const mo = MN.findIndex(x => x.toLowerCase() === m[2].toLowerCase()); if(mo >= 0) return iso(+m[3], mo + 1, +m[1]); }
  return null;
  function iso(y, mo, d){ if(y < 100) y += 2000; if(mo < 1 || mo > 12 || d < 1 || d > 31) return null; return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }
}
function parseAmt(s){
  if(s == null || s === '') return null;
  let neg = /^\(.*\)$/.test(s) || /-/.test(s) || /\bDR$/i.test(s);
  const n = parseFloat(String(s).replace(/[^0-9.]/g, ''));
  return isNaN(n) ? null : (neg ? -n : n);
}
const normDesc = s => String(s).toLowerCase().replace(/[^a-z ]+/g, ' ').replace(/\s+/g, ' ').trim().split(' ').slice(0, 3).join(' ');
// Money moving between your own accounts: card payments, savings transfers. Only a default; each row can be changed
const TRANSFER_RE = /\b(transfer|tfr|payment received|payment thank you|thank you|credit card|card payment|direct debit payment|savings|isa)\b/i;
const rawOf = o => (o.importKey || '').split('|').slice(3).join('|');
function startImport(text){
  const rows = parseCsv(text);
  let h = rows.slice(0, 15).findIndex(r => r.length >= 3 && r.some(c => /date/i.test(c)));
  let headers, body;
  if(h >= 0){ headers = rows[h]; body = rows.slice(h + 1); }
  else { const w = Math.max(0, ...rows.map(r => r.length)); headers = Array.from({length: w}, (_, i) => 'Column ' + (i + 1)); body = rows; }
  if(!body.length){ toast('That file has no rows to import.'); return; }
  const find = (...res) => { for(const re of res){ const i = headers.findIndex(x => re.test(x)); if(i >= 0) return i; } return -1; };
  const sample = c => body.slice(0, 20).map(r => r[c] || '');
  let cDate = find(/^date$/i, /transaction date/i, /date/i);
  if(cDate < 0) cDate = headers.findIndex((_, c) => sample(c).filter(parseDate).length > sample(c).length / 2);
  const cOut = find(/debit/i, /paid out/i, /money out/i, /withdraw/i, /^out$/i);
  const cIn = find(/credit(?! card)/i, /paid in/i, /money in/i, /deposit/i, /^in$/i);
  let cAmt = find(/^amount/i, /amount/i, /^value/i);
  const cDesc = find(/description/i, /^name$/i, /merchant/i, /payee/i, /counter ?party/i, /narrative/i, /details/i, /reference/i, /memo/i);
  const split = cOut >= 0 && cIn >= 0 && cOut !== cIn;
  if(cAmt < 0 && !split) cAmt = headers.findIndex((x, c) => c !== cDate && !/balance/i.test(x) && sample(c).filter(v => parseAmt(v) !== null && /\d/.test(v) && !parseDate(v)).length > sample(c).length / 2);
  imp = {headers, body, cDate, cDesc, cAmt, cOut, cIn, split, negIsSpend: true, card: false, items: []};

function buildImport(){

  state.incomes.forEach(i => { if(i.importKey) keys.add(i.importKey); dated.add('in|' + i.date + '|' + (+i.amount).toFixed(2)); });
  state.transfers.forEach(x => { if(x.importKey) keys.add(x.importKey); });

    let signed;
    if(imp.split){ const o = Math.abs(parseAmt(r[imp.cOut]) || 0), i = Math.abs(parseAmt(r[imp.cIn]) || 0); signed = i - o; }
    else { const a = parseAmt(r[imp.cAmt]); signed = a === null ? 0 : (imp.negIsSpend ? a : -a); }
    if(!date || !signed) return null;
    const kind = signed < 0 ? 'out' : 'in', amount = round2(Math.abs(signed)), low = raw.toLowerCase();
    const key = date + '|' + kind + '|' + amount.toFixed(2) + '|' + low;
    const mem = state.merchantMap[normDesc(raw)];
    const hit = known.get(low) || known.get(titles.find(t => low.includes(t)) || '');
    const dup = keys.has(key) ? 'Already imported' : dated.has(kind + '|' + date + '|' + amount.toFixed(2)) ? 'Possible duplicate' : '';
    return {date, raw, kind, amount, key, dup, on: !dup, group: (kind === 'out' && mem && mem.group) || '', title: (mem && mem.title) || raw || (kind === 'in' ? 'Income' : 'Purchase'),
      categoryId: (mem && state.categories.some(c => c.id === mem.categoryId) && mem.categoryId) || (hit && state.categories.some(c => c.id === hit.categoryId) && hit.categoryId) || '',
      type: (mem ? mem.transfer : (imp.card && kind === 'in') || TRANSFER_RE.test(raw)) ? 'transfer' : (mem ? mem.recurring : hit && hit.recurring) ? 'recurring' : 'normal'};

}

    <div class="maprow">

function drawImportRows(){

      <td class="r num ${x.kind === 'in' ? 'pos' : ''}">${x.kind === 'in' ? '+' : ''}${fmt(x.amount)}</td><td>${x.dup ? `<span class="chip warn">${x.dup}</span>` : x.group && x.type === 'normal' ? `<span class="chip">joins ${esc(x.group)}</span>` : ''}</td></tr>`).join('')}

    <div class="sheet-foot"><span class="soft num" id="impSum">${on.length} to import · ${fmt(out)} out · ${fmt(inn)} in${skipped ? ' · ' + skipped + ' transfer' + (skipped === 1 ? '' : 's') + ' recorded separately' : ''}</span><span class="spacer"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="imp-go" ${on.length || skipped ? '' : 'disabled'}>Import ${on.length} entr${on.length === 1 ? 'y' : 'ies'}</button></div>`

function runImport(){
  const picked = imp.items.filter(x => x.on), on = picked.filter(x => x.type !== 'transfer'); if(!picked.length) return;
  pushUndo();
  picked.filter(x => x.type === 'transfer').forEach(x => {
    const k = normDesc(x.raw), t = x.title.trim();
    // Only remember a title the user actually changed, so one bank reference doesn't stick to every later transfer
    rememberTransfer(k, t && t !== x.raw ? t : '');
    state.transfers.push({id: uid('x'), monthKey: monthFor(x.date), date: x.date, kind: x.kind, amount: x.amount, title: transferTitle(x.raw, t || x.raw || 'Transfer'), importKey: x.key});
  });
  on.forEach(x => { x.recurring = x.type === 'recurring';
    const ym = monthFor(x.date), title = x.title.trim() || x.raw || 'Untitled';
    if(!state.addedMonths.includes(ym)) state.addedMonths.push(ym);
    if(x.kind === 'in') state.incomes.push({id: uid('i'), monthKey: ym, label: title, amount: x.amount, date: x.date, recurring: x.recurring, importKey: x.key});
    else if(x.group && x.type === 'normal'){
      let lump = state.transactions.find(t => t.monthKey === ym && !t.recurring && t.desc.toLowerCase() === x.group.toLowerCase());
      if(!lump){ lump = {id: uid('t'), monthKey: ym, categoryId: x.categoryId || uncategorized().id, recurring: false, desc: x.group, items: []}; state.transactions.push(lump); }
      lump.items.push({id: uid('li'), name: title, amount: x.amount, date: x.date, importKey: x.key});
    }
    else state.transactions.push({id: uid('t'), monthKey: ym, categoryId: x.categoryId || uncategorized().id, recurring: x.recurring, desc: title, items: [{id: uid('li'), name: '', amount: x.amount, date: x.date}], importKey: x.key});
    const k = normDesc(x.raw);
    if(k) state.merchantMap[k] = Object.assign({title, categoryId: x.categoryId || '', recurring: x.recurring}, x.group && x.type === 'normal' ? {group: x.group} : {});
  });
  if(on.length) selMonth = monthFor(on[on.length - 1].date);
  persist(); closeSheet(); page = 'month'; render();
  toast(`Imported ${on.length} entr${on.length === 1 ? 'y' : 'ies'}` + (picked.length > on.length ? `, recorded ${picked.length - on.length} transfer${picked.length - on.length === 1 ? '' : 's'} separately` : ''), true);
}

// ---------- snapshot files ----------
async function exportSnapshot(){
  const data = JSON.stringify(state, null, 2), filename = 'passbook-snapshot-' + todayIso() + '.json';
  try{
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if(dl){ await dl.save({filename, data}); toast('Snapshot saved'); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'})); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }catch(e){ if(!e || e.code !== 'declined') toast('The snapshot could not be saved here.'); }
}
function loadSnapshot(text){
  let p;
  try{ p = JSON.parse(text); if(!p || !Array.isArray(p.transactions) || !Array.isArray(p.incomes) || !Array.isArray(p.categories)) throw 0; }
  catch(e){ toast('That file is not a Passbook snapshot. Choose the .json file saved from Passbook.'); return; }
  const had = !!state;
  if(had) pushUndo();
  delete p.isExample;
  state = migrate(p); state.settings.incomeFollowsDate = true; resortImports(); selMonth = null; openCats = new Map(); page = 'savings';
  persist(); render();
  reindex();
  toast(`Loaded ${state.transactions.length + state.incomes.length} entries across ${IDX.keys.length} months`, had);
}
function exampleData(){
  const s = blankState(); s.isExample = true;
  let seed = 11; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const now = curYm(), today = +todayIso().slice(8);
  for(let k = 15; k >= 0; k--){
    const ym = addMonths(now, -k), day = n => ym + '-' + String(n).padStart(2, '0');
    const tx = (desc, cat, amt, d, rec) => { if(k === 0 && d > today) return; s.transactions.push({id: uid('t'), monthKey: ym, categoryId: cat, recurring: !!rec, desc, items: [{id: uid('li'), name: '', amount: amt, date: day(d)}]}); };
    s.addedMonths.push(ym);
    s.incomes.push({id: uid('i'), monthKey: ym, label: 'Salary', amount: k > 8 ? 2950 : 3100, date: day(1), recurring: true});
    tx('Rent', 'bills', 1150, 1, true); tx('Phone plan', 'bills', 32, 1, true); tx('Gym', 'bills', 28, 1, true); tx('Streaming', 'entertainment', 18, 1, true);
    [3, 10, 17, 24].forEach(d => tx('Weekly shop', 'supermarket', Math.round(58 + rnd() * 24), d));
    tx('Fuel', 'transport', Math.round(50 + rnd() * 15), 5); tx('Dinner out', 'eatingout', Math.round(25 + rnd() * 50), 12); tx('Lunch', 'eatingout', Math.round(12 + rnd() * 12), 20);
    if(rnd() > .4) tx('Drinks', 'social', Math.round(20 + rnd() * 40), 18);
    if(rnd() > .55) tx('Clothes', 'shopping', Math.round(40 + rnd() * 260), 21);
    if(rnd() > .8) tx('Car repair', 'transport', Math.round(300 + rnd() * 900), 14);
  }
  s.balanceHistory.push({id: uid('bh'), date: addMonths(now, -15) + '-01', monthKey: addMonths(now, -15), accounts: {debit: 1500, savings: 0, isa: 0}, total: 1500});
  return s;
}

  else if(a === 'start-empty'){ state = blankState(); persist(); page = 'month'; render(); }
  else if(a === 'start-example'){ state = exampleData(); persist(); page = 'savings'; render(); }
  else if(a === 'wipe') confirmSheet('Delete everything?', 'Every month, entry, category and balance record will be removed. Save a snapshot file first if you might want it back.', 'Delete everything', () => { pushUndo(); state = blankState(); selMonth = null; persist(); render(); toast('Everything deleted', true); });
});
$('fab').addEventListener('click', () => openEntry({kind: 'spend', monthKey: page === 'month' && !searchQ ? selMonth : curYm()}));

document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'search'){ searchQ = t.value; bulk = {categoryId: '', name: '', title: ''}; excluded.clear(); renderLists(); }
  else if(t.id === 'bulkName') bulk.name = t.value;
  else if(t.id === 'bulkTitle') bulk.title = t.value;
  else if(draft && t.dataset.f){ draft[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; if(t.dataset.f === 'monthKey') draft.monthTouched = true; }
  else if(draft && t.dataset.k){ draft.items[+t.dataset.i][t.dataset.k] = t.value;
    if(t.dataset.k === 'date' && t.dataset.i === '0' && (!draft.ref || draft.kind === 'income') && !draft.monthTouched && /^\d{4}-\d\d-\d\d$/.test(t.value)){ draft.monthKey = monthFor(t.value); const ms = $('e-month'); if([...ms.options].some(o => o.value === draft.monthKey)) ms.value = draft.monthKey; } const tot = $('e-total'); if(tot) tot.textContent = 'Total ' + fmt(draft.items.reduce((s, it) => s + (parseFloat(it.amount) || 0), 0)); }
  else if(imp && t.dataset.imp === 'title') imp.items[+t.dataset.i].title = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.excl){ t.checked ? excluded.delete(t.dataset.excl) : excluded.add(t.dataset.excl); renderLists(); }
  else if(t.dataset.mm){ const k = t.dataset.mm, title = t.value.trim(); pushUndo();
    rememberTransfer(k, title); if(!title) delete state.merchantMap[k].title;
    let n = 0; if(title) state.transfers.forEach(x => { if(normDesc(rawOf(x)) === k){ x.title = title; n++; } });
    persist(); toast(title ? `Title saved${n ? `, ${n} recorded transfer${n === 1 ? '' : 's'} renamed` : ''}` : 'Custom title removed', true); }
  else if(t.id === 'monthPick'){ selMonth = t.value; searchQ = ''; render(); }
  else if(t.id === 'prefStart'){ pushUndo(); state.settings.monthStartDay = +t.value; const n = resortImports(); selMonth = null; persist(); render(); toast(`Months now start on the ${ordinal(+t.value)}` + (n ? `. Moved ${n} entr${n === 1 ? 'y' : 'ies'}` : ''), true); }
  else if(t.id === 'prefCollapse'){ state.settings.collapseCategoriesByDefault = t.checked; openCats = new Map(); persist(); }
  else if(t.dataset.cat){ const c = state.categories.find(c => c.id === t.dataset.cat); if(c){ c.name = t.value.trim() || c.name; t.value = c.name; persist(); } }
  else if(t.id === 'qaCat') qa.categoryId = t.value;
  else if(t.id === 'bulkCat') bulk.categoryId = t.value;
  else if(t.id === 'qaDate') qa.date = t.value;
  else if(t.id === 'qaTitle' || t.id === 'e-title'){
    // A title used before brings its category with it
    const hit = knownTitles().get(t.value.trim().toLowerCase()); if(!hit || !state.categories.some(c => c.id === hit.categoryId)) return;
    if(t.id === 'qaTitle' && qa.kind !== 'income'){ qa.categoryId = hit.categoryId; $('qaCat').value = hit.categoryId; }
    if(t.id === 'e-title' && draft && !draft.ref && draft.kind !== 'income'){ draft.categoryId = hit.categoryId; $('e-cat').value = hit.categoryId; }
  }
  else if(imp && t.dataset.map){ imp[t.dataset.map] = t.dataset.map === 'negIsSpend' || t.dataset.map === 'card' ? t.value === '1' : +t.value; buildImport(); drawImportRows(); }
  else if(imp && t.dataset.imp){ const x = imp.items[+t.dataset.i], k = t.dataset.imp; x[k] = t.type === 'checkbox' ? t.checked : t.value; if(k === 'on' || k === 'type') drawImportRows(); }
  else if(t.id === 'fileSnap' || t.id === 'fileCsv'){
    const f = t.files[0]; t.value = ''; if(!f) return;
    const r = new FileReader(); r.onload = () => t.id === 'fileSnap' ? loadSnapshot(r.result) : startImport(r.result); r.readAsText(f);
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if(f.id === 'entryForm') saveEntry(false);
  else if(f.id === 'fbEmail') fbEmailSignIn(false);
  else if(f.id === 'trfForm'){ const x = state.transfers.find(x => x.id === f.dataset.id); if(x) saveTransfer(x); }
  else if(f.id === 'qaForm'){
    const amount = round2(parseFloat($('qaAmount').value)), title = $('qaTitle').value.trim(), date = $('qaDate').value || null;
    if(!(amount > 0)) return;
    pushUndo(); qa.date = date || qa.date;
    const from = selMonth; if(date) selMonth = monthFor(date);
    if(qa.kind === 'income') state.incomes.push({id: uid('i'), monthKey: selMonth, label: title || 'Income', amount, date, recurring: false});
    else { state.transactions.push({id: uid('t'), monthKey: selMonth, categoryId: qa.categoryId, recurring: qa.kind === 'recurring', desc: title || 'Untitled', items: [{id: uid('li'), name: '', amount, date}]});
      openCats.set(qa.categoryId, true); state.lastEntryDefaults = {categoryId: qa.categoryId, date}; }
    persist(); render(); toast('Added ' + (title || 'entry') + ' · ' + fmt(amount) + (selMonth !== from ? ' to ' + monthLabel(selMonth) : ''), true); $('qaTitle').focus();
  }
  else if(f.id === 'balForm'){
    const v = k => round2(parseFloat(f.elements[k].value) || 0), date = f.elements.date.value || todayIso();
    pushUndo();
    state.balanceHistory.push({id: uid('bh'), date, monthKey: date.slice(0, 7), accounts: {debit: v('debit'), savings: v('savings'), isa: v('isa')}, total: round2(v('debit') + v('savings') + v('isa'))});
    persist(); render(); toast('Balances recorded', true);
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('sheetRoot').firstChild) closeSheet(); });
window.addEventListener('hashchange', () => { const p = location.hash.slice(1); if(PAGES.some(x => x[0] === p) && p !== page){ page = p; if(state) render(); window.scrollTo(0, 0); } });
let rz = null, lastW = window.innerWidth;
window.addEventListener('resize', () => { if(window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(rz); rz = setTimeout(() => { if(state && (page === 'savings' || page === 'years')){ page === 'savings' ? drawSavings() : drawYears(); } }, 150); });
// Pick up changes made on another device when this one comes back into view
document.addEventListener('visibilitychange', async () => {
  if(document.hidden || !store || !store.cloud || !state || store.busy() || !store.stale() || $('sheetRoot').firstChild) return;
  try{ const fresh = await store.load(); if(!fresh || store.busy()) return; const before = JSON.stringify(state); state = migrate(fresh); store.mark(state); if(JSON.stringify(state) !== before) render(); }catch(e){}
});

// ---------- Firebase ----------
async function loadFirebase(){
  if(fb) return fb;
  const [app, A, F] = await Promise.all(['app', 'auth', 'firestore'].map(n => import(FIREBASE_SDK + 'firebase-' + n + '.js')));
  const a = app.initializeApp(FIREBASE_CONFIG);
  return fb = {A, F, auth: A.getAuth(a), db: F.getFirestore(a), user: null};
}
// Gives the cloud store the same get/doc shape it already uses; each person's data sits under users/<uid>/passbook
function fbCollection(uid){
  const {F, db} = fb, path = ['users', uid, 'passbook'];
  return {get: () => F.getDocs(F.collection(db, ...path)),
    doc: id => ({set: d => F.setDoc(F.doc(db, ...path, id), d), delete: () => F.deleteDoc(F.doc(db, ...path, id))})};
}
const fbMsg = e => ({
  'auth/invalid-credential': 'That email and password do not match.',
  'auth/invalid-email': 'That email address does not look right.',
  'auth/email-already-in-use': 'There is already an account with that email. Sign in instead.',
  'auth/weak-password': 'Use a password of at least 6 characters.',
  'auth/unauthorized-domain': 'This web address is not allowed to sign in yet. In Firebase, add it under Authentication › Settings › Authorized domains.',
  'auth/operation-not-allowed': 'This sign-in method is switched off. Turn it on in Firebase under Authentication › Sign-in method.',
  'auth/network-request-failed': 'Could not reach Firebase. Check your connection.',
  'auth/too-many-requests': 'Too many attempts. Wait a few minutes and try again.'
}[e && e.code] || 'Sign-in did not work' + (e && e.code ? ` (${e.code})` : '') + '.');
function showSignIn(msg){
  setSync('local', 'Not signed in');
  $('view').innerHTML = `<div class="welcome"><h1>Sign in to open your ledger.</h1>
    <p class="soft">Your data is kept in your own Firebase database. Sign in the same way on each device and they share one ledger.</p>
    <div><button class="btn primary" id="fbGoogle">Continue with Google</button></div>
    <form id="fbEmail" class="card" style="display:grid;gap:10px;max-width:380px;margin-top:8px">
      <b>Or use email and password</b>
      <input class="inp" id="fbMail" type="email" placeholder="Email" autocomplete="email" required>
      <input class="inp" id="fbPass" type="password" placeholder="Password, at least 6 characters" autocomplete="current-password" required minlength="6">
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit">Sign in</button><button class="btn" type="button" id="fbNew">Create account</button></div>
    </form>
    <p class="err" id="fbErr"${msg ? '' : ' hidden'}>${esc(msg || '')}</p></div>`;
  const fail = e => { const er = $('fbErr'); if(er){ er.textContent = fbMsg(e); er.hidden = false; } };
  $('fbGoogle').onclick = async () => {
    const p = new fb.A.GoogleAuthProvider();
    try{ await fb.A.signInWithPopup(fb.auth, p); boot(); }
    catch(e){
      // Some phone browsers block popups; a full-page redirect works there instead
      if(e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) fb.A.signInWithRedirect(fb.auth, p).catch(fail);
      else if(!(e && e.code === 'auth/popup-closed-by-user' || e && e.code === 'auth/cancelled-popup-request')) fail(e);
    }
  };
  $('fbNew').onclick = () => fbEmailSignIn(true);
}
async function fbEmailSignIn(create){
  const mail = $('fbMail').value.trim(), pass = $('fbPass').value;
  if(!mail || pass.length < 6){ $('fbErr').textContent = 'Enter your email and a password of at least 6 characters.'; $('fbErr').hidden = false; return; }
  try{ await (create ? fb.A.createUserWithEmailAndPassword : fb.A.signInWithEmailAndPassword)(fb.auth, mail, pass); boot(); }
  catch(e){ $('fbErr').textContent = fbMsg(e); $('fbErr').hidden = false; }
}

// ---------- boot ----------
async function boot(){
  $('view').innerHTML = '<p class="soft" style="margin-top:8vh;text-align:center">Opening your ledger…</p>';
  let col = null;
  if(FIREBASE_CONFIG.apiKey){
    let signInErr = null;
    try{
      await loadFirebase();
      await fb.A.getRedirectResult(fb.auth).catch(e => { signInErr = e; });
      fb.user = await new Promise(res => { const off = fb.A.onAuthStateChanged(fb.auth, u => { off(); res(u); }); });
    }catch(e){
      setSync('error', 'Could not reach Firebase');
      $('view').innerHTML = '<div class="welcome"><h1>Firebase could not be reached.</h1><p class="soft">Nothing has been lost. Check your connection, and that the settings at the top of this file were pasted in full, then try again.</p><div><button class="btn primary" id="retry">Try again</button></div></div>';
      $('retry').onclick = boot; return;
    }
    if(!fb.user){ showSignIn(signInErr ? fbMsg(signInErr) : ''); return; }
    col = fbCollection(fb.user.uid);
  }
  else if(window.claude && typeof window.claude.use === 'function'){
    try{
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const me = user ? await user.id() : null;
      if(db && me) col = db.collection('data/users/' + me);
    }catch(e){}
  }
  store = col ? cloudStore(col) : localStore();
  let loaded;
  try{
    loaded = await Promise.race([store.load(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 12000))]);
  }catch(e){
    // Never treat a failed read as an empty ledger: that could overwrite real data
    setSync('error', 'Could not reach your data');
    $('view').innerHTML = '<div class="welcome"><h1>Your ledger could not be reached.</h1><p class="soft">Nothing has been lost. Check your connection and try again.</p><div><button class="btn primary" id="retry">Try again</button></div></div>';
    $('retry').onclick = boot; return;
  }
  state = loaded ? migrate(loaded) : null;
  if(state) store.mark(state);
  setSync(store.cloud ? 'ok' : 'local');
  // One-off: bring money in that was logged before this rule existed into line with the start day
  if(state && !state.settings.incomeFollowsDate){ state.settings.incomeFollowsDate = true; if(resortImports()) persist(); }
  const h = location.hash.slice(1); if(PAGES.some(x => x[0] === h)) page = h;
  render();
}
boot();
</script>
